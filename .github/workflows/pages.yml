# Builds the single-file app, runs the self-tests and the Playwright smoke test, then publishes index.html to
# GitHub Pages. Pages must be switched on in the repo settings (Settings → Pages → Source: GitHub Actions).
name: Test and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/typecheck.mjs
      - run: node scripts/test.mjs
      - run: node scripts/build.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: 'true'
      - name: Stage the site (just the built page)
        if: github.ref == 'refs/heads/main'
        run: mkdir -p site && cp index.html site/index.html
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
